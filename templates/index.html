<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Sistema de Tarefas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">

        <h1>Meu Sistema de Tarefas</h1>

        <p class="subtitulo">Organize suas atividades diárias</p>

        <form action="{{ url_for('adicionar') }}" method="POST" class="formulario">
            <input
                type="text"
                name="titulo"
                placeholder="Digite uma nova tarefa..."
                required
            >

            <button type="submit">Adicionar</button>
        </form>

        <h2>Minhas tarefas</h2>

        {% if tarefas %}

            <ul class="lista-tarefas">

                {% for tarefa in tarefas %}

                    <li class="tarefa">

                        <div class="informacoes">

                            <span class="{% if tarefa['concluida'] == 1 %}concluida{% endif %}">
                                {{ tarefa['titulo'] }}
                            </span>

                            <small>
                                Criada em: {{ tarefa['data_criacao'] }}
                            </small>

                        </div>

                        <div class="acoes">

                            <form action="{{ url_for('concluir', id=tarefa['id']) }}" method="POST">
                                <button type="submit" class="botao-concluir">
                                    {% if tarefa['concluida'] == 1 %}
                                        Desfazer
                                    {% else %}
                                        Concluir
                                    {% endif %}
                                </button>
                            </form>

                            <form action="{{ url_for('excluir', id=tarefa['id']) }}" method="POST">
                                <button type="submit" class="botao-excluir">
                                    Excluir
                                </button>
                            </form>

                        </div>

                    </li>

                {% endfor %}

            </ul>

        {% else %}

            <p class="vazio">Nenhuma tarefa cadastrada.</p>

        {% endif %}

    </div>

</body>
</html>
